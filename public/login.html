<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TracePoint | Log in</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

<div class="login-container">
  <div class="login-card">

    <div class="login-brand">
      <div class="brand-icon">&#9635;</div>
      <div>
        <h1>TracePoint</h1>
        <p>Asset Traceability System</p>
      </div>
    </div>

    <div class="login-heading">
      <h2>Welcome back</h2>
      <p>Sign in to continue to TracePoint.</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@company.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" autocomplete="current-password" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" onclick="togglePassword()">Show</button>
        </div>
      </div>

      <div id="loginError" class="login-error" hidden></div>

      <button type="submit" class="btn primary login-button">Sign in</button>

    </form>

    <div class="login-foot"><a href="forgotPassword.html">Forgot your password?</a></div>
    <div class="login-foot">
      Don't have an account? <a href="createAccount.html">Sign up</a>
    </div>

  </div>
</div>

<script src="script.js"></script>
<script>

/* If the browser won't let this page store anything, signing in can't
   survive the move to the dashboard — say so before they try. */
warnIfStorageBlocked();

/* Only a database-backed session can skip the login form. */
const currentUser = getCurrentUser();
if (currentUser && storageGet("token")) {
  window.location.replace(currentUser.mustChangePassword ? "resetPassword.html" : "dashboard.html");
} else if (currentUser) {
  storageRemove("tracepointCurrentUser");
}

/* If a session was ended for them — account disabled, say — explain why
   rather than dropping them at a blank login form. */
const signedOutReason = storageGet("tracepointSignedOutReason");

if (signedOutReason) {
    const error = document.getElementById("loginError");
    error.textContent = signedOutReason;
    error.hidden = false;
    storageRemove("tracepointSignedOutReason");
}

function togglePassword() {
    const field = document.getElementById("password");
    const button = document.querySelector(".password-toggle");
    const hidden = field.type === "password";
    field.type = hidden ? "text" : "password";
    button.textContent = hidden ? "Hide" : "Show";
}

document.getElementById("loginForm").addEventListener("submit", async function (event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const error = document.getElementById("loginError");

    const result = await loginUser(email, password);

    if (!result.success) {
        error.textContent = result.message;
        error.hidden = false;
        return;
    }

    window.location.href = result.user.mustChangePassword ? "resetPassword.html" : "dashboard.html";
});

</script>

</body>
</html>
