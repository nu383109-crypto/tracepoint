<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TracePoint | Forgot password</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">&#9635;</div>
      <div><h1>TracePoint</h1><p>Asset Traceability System</p></div>
    </div>
    <div class="login-heading">
      <h2>Reset your password</h2>
      <p>Enter your account email to request a one-time reset link.</p>
    </div>
    <form id="forgotPasswordForm">
      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div id="forgotMessage" class="login-error" hidden></div>
      <button type="submit" class="btn primary login-button">Send reset link</button>
    </form>
    <div class="login-foot"><a href="login.html">Back to sign in</a></div>
  </div>
</div>
<script src="script.js"></script>
<script>
document.getElementById("forgotPasswordForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = document.getElementById("forgotMessage");
    const button = event.currentTarget.querySelector("button[type=submit]");
    button.disabled = true;
    message.classList.remove("success");
    message.hidden = true;

    try {
        const result = await apiFetch("/auth/forgot-password", {
            method: "POST",
            body: JSON.stringify({ email: document.getElementById("email").value.trim() })
        });
        message.textContent = result.message;
        message.classList.add("success");
    } catch (error) {
        message.textContent = error.message;
    } finally {
        message.hidden = false;
        button.disabled = false;
    }
});
</script>
</body>
</html>
