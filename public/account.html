<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TracePoint | Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">&#9635;</div>
      <div><h1>TracePoint</h1><p>Asset Traceability System</p></div>
    </div>
    <div class="login-heading">
      <h2>Change your password</h2>
      <p id="accountEmail"></p>
    </div>
    <form id="accountPasswordForm">
      <div class="form-group">
        <label for="currentPassword">Current password</label>
        <input type="password" id="currentPassword" autocomplete="current-password" required>
      </div>
      <div class="form-group">
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="6" required>
        <span class="field-hint">Use at least 6 characters.</span>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6" required>
      </div>
      <div id="accountMessage" class="login-error" hidden></div>
      <button type="submit" class="btn primary login-button">Update password</button>
    </form>
    <div class="login-foot"><a href="dashboard.html">Back to dashboard</a></div>
  </div>
</div>
<script src="script.js"></script>
<script>
const currentUser = getCurrentUser();
if (!currentUser || !storageGet("token")) {
    window.location.replace("login.html");
} else if (currentUser.mustChangePassword) {
    window.location.replace("resetPassword.html");
} else {
    document.getElementById("accountEmail").textContent = currentUser.email;
}

document.getElementById("accountPasswordForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const currentPassword = document.getElementById("currentPassword").value;
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const message = document.getElementById("accountMessage");

    if (newPassword !== confirmPassword) {
        message.textContent = "The passwords do not match.";
        message.hidden = false;
        return;
    }

    try {
        const result = await apiFetch("/auth/password", {
            method: "POST",
            body: JSON.stringify({ currentPassword, newPassword })
        });
        message.textContent = result.message;
        message.classList.add("success");
        message.hidden = false;
        document.getElementById("accountPasswordForm").reset();
    } catch (error) {
        message.textContent = error.message;
        message.classList.remove("success");
        message.hidden = false;
    }
});
</script>
</body>
</html>
