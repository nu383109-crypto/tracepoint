<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TracePoint | Reset password</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">&#9635;</div>
      <div>
        <h1>TracePoint</h1>
        <p>Asset Traceability System</p>
      </div>
    </div>
    <div class="login-heading">
      <h2 id="resetTitle">Set up your account</h2>
      <p id="resetDescription">Confirm your name and choose whether to keep your current password.</p>
    </div>
    <form id="resetPasswordForm">
      <div class="form-group" id="nameGroup">
        <label for="name">Name</label>
        <input type="text" id="name" autocomplete="name" required maxlength="120">
      </div>
      <div class="form-group">
        <label for="newPassword">New password (optional)</label>
        <input type="password" id="newPassword" autocomplete="new-password" minlength="6">
        <span class="field-hint">Leave blank to keep your current password. New passwords need at least 6 characters.</span>
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="6">
      </div>
      <div id="resetError" class="login-error" hidden></div>
      <button type="submit" id="resetSubmit" class="btn primary login-button">Continue</button>
    </form>
  </div>
</div>
<script src="script.js"></script>
<script>
const currentUser = getCurrentUser();
const resetToken = getQueryParam("token");
const nameInput = document.getElementById("name");
if (resetToken) {
  document.getElementById("resetTitle").textContent = "Choose a new password";
  document.getElementById("resetDescription").textContent = "Enter and confirm your new password.";
  document.getElementById("nameGroup").hidden = true;
  nameInput.disabled = true;
  nameInput.required = false;
  document.getElementById("newPassword").required = true;
  document.getElementById("confirmPassword").required = true;
  document.getElementById("resetSubmit").textContent = "Reset password";
} else if (!currentUser || !storageGet("token")) {
  window.location.replace("login.html");
} else if (!currentUser.mustChangePassword) {
  window.location.replace("dashboard.html");
} else {
  document.getElementById("name").value = currentUser.name || "";
}

document.getElementById("resetPasswordForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const error = document.getElementById("resetError");

    if (newPassword && newPassword !== confirmPassword) {
        error.textContent = "The passwords do not match.";
        error.hidden = false;
        return;
    }
    if (!newPassword && confirmPassword) {
      error.textContent = "Enter a new password or leave both password fields blank.";
      error.hidden = false;
      return;
    }

    try {
      if (resetToken) {
        await apiFetch("/auth/reset-password", {
          method: "POST",
          body: JSON.stringify({ token: resetToken, newPassword })
        });
        storageRemove("token");
        storageRemove("tracepointCurrentUser");
        window.location.replace("login.html?reset=complete");
        return;
      }

      const result = await apiFetch("/auth/password", {
            method: "POST",
        body: JSON.stringify({ name: document.getElementById("name").value, newPassword })
        });
      const updatedUser = {
        ...currentUser,
        ...result.user,
        role: result.user.role === "IT/Systems Administrator" ? ROLES.ADMIN : result.user.role
      };
      storageSet("tracepointCurrentUser", JSON.stringify(updatedUser));
        window.location.replace("dashboard.html");
    } catch (err) {
        error.textContent = err.message;
        error.hidden = false;
    }
});
</script>
</body>
</html>
